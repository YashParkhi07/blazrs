<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Blazrs</title>
    <meta name="description"
        content="Get in touch with Blazrs. Let's discuss how we can help transform your business through innovative Salesforce solutions.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Outfit:wght@300;400;600;700&family=Montserrat:wght@800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="logos/Blazrs Logo.png">
  <link rel="apple-touch-icon" href="logos/Blazrs Logo.png">
</head>

<body class="contact-page">
    <header class="main-header">
        <a href="index.html#hero" class="header-logo">
            <img src="logos/Blazrs Logo.png" alt="BLAZRS" class="header-logo-img">
        </a>
        <nav class="header-nav">
            <a href="index.html#about">KNOW MORE</a>
            <div class="nav-dropdown">
                <a class="nav-dropdown-trigger" style="color:inherit; text-decoration:none;">SERVICES</a>
                <div class="nav-dropdown-menu">
            <a href="salesforce.html">Salesforce</a>
          </div>
            </div>
            <a href="blazx.html" class="nav-blazx">PRODUCTS</a>
            <a href="blogs.html">BLOGS</a>
        </nav>
    </header>

    <main class="contact-container">
        <!-- Left: Info -->
        <div class="contact-info reveal">
            <p class="contact-eyebrow">GET IN TOUCH</p>
            <h1 class="contact-heading">Let's build<br>something great.</h1>
            <p class="contact-subtext">Have a project in mind or want to explore how we can help your business grow?
                We'd love to hear from you.</p>

            <div class="contact-details">
                <div class="contact-detail-item">
                    <span class="contact-label">EMAIL</span>
                    <a href="mailto:theblazrs@gmail.com" class="contact-link">theblazrs@gmail.com</a>
                </div>
            </div>

            <div class="contact-social">
                <span class="contact-social-label">FOLLOW US</span>
                <div class="contact-social-icons">
                    <a href="https://www.linkedin.com/company/blazrs/" aria-label="LinkedIn" class="contact-social-link">in</a>
                    <a href="#" aria-label="Instagram" class="contact-social-link">ig</a>
                </div>
            </div>
        </div>

        <!-- Right: Form -->
        <div class="contact-form-wrapper reveal">
            <form class="contact-form" id="contact-form">
                <div class="form-group">
                    <label for="contact-name" class="form-label">Name</label>
                    <input type="text" id="contact-name" name="name" class="form-input" placeholder="Your full name"
                        required autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="contact-email" class="form-label">Email</label>
                    <input type="email" id="contact-email" name="email" class="form-input" placeholder="you@company.com"
                        required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="contact-company" class="form-label">Company</label>
                    <input type="text" id="contact-company" name="company" class="form-input"
                        placeholder="Your company name" autocomplete="organization">
                </div>
                <div class="form-group">
                    <label for="contact-message" class="form-label">Message</label>
                    <textarea id="contact-message" name="message" class="form-input form-textarea"
                        placeholder="Tell us about your project or ask a question..." rows="5" required></textarea>
                </div>
                <button type="submit" class="form-submit" id="contact-submit">SEND MESSAGE</button>
                <p class="form-success" id="form-success">Thanks! We'll be in touch soon.</p>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
